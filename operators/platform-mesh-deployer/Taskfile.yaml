version: '3'

includes:
  # Shared go-installable tooling (controller-gen, golangci-lint, mockery),
  # installed once into the root bin/ and reused by every component.
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

vars:
  CRD_DIRECTORY: config/crd

tasks:
  ## Development
  manifests:
    cmds:
      - task: tools:generate-crds
        vars:
          PATH: /deployer/...
          OUTPUT: '{{.CRD_DIRECTORY}}'
  # The deployer CRDs live on the management cluster, not in kcp — no apigen.
  generate:
    cmds:
      - task: manifests
      - task: tools:generate-deepcopy
        vars:
          PATH: /deployer/...
  generate:mocks:
    desc: Generate mocks using mockery
    deps: [tools:mockery]
    cmds:
      - "{{.BIN}}/mockery"
  build:
    desc: Build the platform-mesh-deployer.
    cmds:
      - go build ./...
  docker-build:
    cmds:
      - docker build .
  ## Testing
  fmt:
    cmds:
      - go fmt ./...
  lint:
    cmds:
      - task: fmt
      - task: tools:lint
  test:
    desc: Run unit tests.
    cmds:
      - go test -count=1 ./...
  test-e2e:
    cmds:
      - echo "no e2e tests defined yet"
  cover:
    cmds:
      - go test -count=1 ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...

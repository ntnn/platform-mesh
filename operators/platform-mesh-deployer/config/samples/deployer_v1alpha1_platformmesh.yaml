apiVersion: deployer.platform-mesh.io/v1alpha1
kind: PlatformMesh
metadata:
  name: platform-mesh-sample
  namespace: platform-mesh-system
spec:
  version: 1.0.0
  ocm:
    url: ghcr.io/platform-mesh
    component: github.com/platform-mesh/platform-mesh
  topology:
    rootShard:
      name: root
      etcd:
        replicas: 3
      template:
        replicas: 2
        extraArgs:
          - --v=4
      virtualWorkspaces:
        mode: Embedded
        exposure:
          hostnameTemplate: "vw-{{ .Name }}.example.com"
          port: 443
    frontProxies:
      - name: default
        exposure:
          hostnameTemplate: "kcp.example.com"
          port: 443
  ingress:
    - name: default
      type: gatewayapi

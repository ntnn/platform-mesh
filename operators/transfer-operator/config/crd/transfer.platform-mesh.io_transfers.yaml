---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: transfers.transfer.platform-mesh.io
spec:
  group: transfer.platform-mesh.io
  names:
    kind: Transfer
    listKind: TransferList
    plural: transfers
    singular: transfer
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.direction
      name: Direction
      type: string
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Transfer mirrors objects between this control plane and a target.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TransferSpec defines the desired state of Transfer.
            properties:
              direction:
                description: Direction decides which side owns the spec.
                enum:
                - Push
                - Pull
                type: string
              providerRef:
                description: ProviderRef names any Provider.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: providerRef.name must not be empty
                  rule: size(self.name) > 0
              resources:
                description: Resources selects the objects to transfer.
                items:
                  description: ResourceSelector narrows the objects to transfer.
                  properties:
                    group:
                      description: Group is the API group to transfer. The empty string
                        selects the core group.
                      type: string
                    kind:
                      description: Kind is the kind name. Mutually exclusive with
                        Resource.
                      type: string
                    names:
                      description: |-
                        Names restricts the transfer to explicitly named objects.
                        It composes with any level of narrowing above, so a group and
                        a name transfers every object of that name in the group.
                      items:
                        type: string
                      type: array
                    namespaces:
                      description: |-
                        Namespaces restricts the transfer to these namespaces.
                        Empty selects all of them, including cluster-scoped resources.
                        Must be empty for cluster-scoped resources.
                      items:
                        type: string
                      type: array
                    resource:
                      description: Resource is the plural resource name. Mutually
                        exclusive with Kind.
                      type: string
                    selector:
                      description: Selector restricts the transfer to objects carrying
                        these labels.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    version:
                      description: Version, when empty, resolves to the storage version
                        of every kind in Group.
                      type: string
                  required:
                  - group
                  type: object
                  x-kubernetes-validations:
                  - message: resource and kind are mutually exclusive
                    rule: '!(has(self.resource) && size(self.resource) > 0 && has(self.kind)
                      && size(self.kind) > 0)'
                minItems: 1
                type: array
            required:
            - direction
            - providerRef
            - resources
            type: object
          status:
            description: |-
              TransferStatus defines the observed state of Transfer.

              Like KubeconfigProviderStatus it reports nothing per cluster, so its size is
              independent of how many clusters the referenced provider engages.
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Transfer resource.

                  Condition types used by the transfer operator:
                  - "ResourcesResolved": every selector resolved to at least one kind
                  - "ProviderReady": the referenced KubeconfigProvider is usable
                  - "Ready": objects are being transferred
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              resolvedResources:
                description: ResolvedResources are the concrete kinds the selectors
                  resolved to.
                items:
                  description: |-
                    GroupVersionKind unambiguously identifies a kind.  It doesn't anonymously include GroupVersion
                    to avoid automatic coercion.  It doesn't use a GroupVersion to avoid custom marshalling
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    version:
                      type: string
                  required:
                  - group
                  - kind
                  - version
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

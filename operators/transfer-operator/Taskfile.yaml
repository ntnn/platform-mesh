version: '3'

includes:
  # Shared go-installable tooling (controller-gen, golangci-lint, ...) installed
  # into the root bin/.
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

vars:
  CRD_DIRECTORY: config/crd
  TEST_SETUP_DIRECTORY: test/e2e/setup

tasks:
  build:
    desc: Build the module
    cmds:
      # Discard the binary: go build only does that on its own for >1 package, and
      # with a lone main package in ./cmd it would try to write over that directory.
      - go build -o /dev/null ./...

  fmt:
    desc: Run go fmt
    cmds:
      - go fmt ./...

  lint:
    desc: Run linter
    cmds:
      - task: fmt
      - task: tools:lint

  manifests:
    desc: Generate CRD manifests for the transfer API group
    cmds:
      - task: tools:generate-crds
        vars:
          PATH: /transfer/...
          OUTPUT: '{{.CRD_DIRECTORY}}'
      - task: tools:generate-rbac
        vars:
          PATHS: '{{.TOPLEVEL}}/apis/transfer/...'
          OUTPUT: config/rbac
          ROLE: transfer-operator

  generate:
    desc: Regenerate CRDs and the kcp API resources consumed at runtime and by the e2e suite
    cmds:
      - task: manifests
      - "{{.BIN}}/apigen --input-dir {{.CRD_DIRECTORY}} --output-dir ./config/resources --header-file {{.HACK}}/boilerplate/boilerplate.yaml.txt"
      - "{{.BIN}}/apigen --input-dir {{.CRD_DIRECTORY}} --output-dir {{.TEST_SETUP_DIRECTORY}} --header-file {{.HACK}}/boilerplate/boilerplate.yaml.txt"

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test-e2e:
    desc: No e2e tests yet; the suite arrives with the payload controllers.
    cmds:
      - 'echo "transfer-operator: no e2e tests"'

  cover:
    desc: Run unit tests with coverage
    cmds:
      - go test -v -coverprofile=./cover.out -covermode=atomic -coverpkg=./... ./...

  docker-build:
    desc: Build the Docker image (build context is the repo root)
    vars:
      IMG: '{{.IMG | default "localhost/transfer-operator:dev"}}'
    cmds:
      - docker build -t {{.IMG}} -f Dockerfile ../../

  kind-load:
    desc: Load the Docker image into a kind cluster
    vars:
      IMG: '{{.IMG | default "localhost/transfer-operator:dev"}}'
      KIND_CLUSTER: '{{.KIND_CLUSTER | default "kind"}}'
    cmds:
      - kind load docker-image --name {{.KIND_CLUSTER}} {{.IMG}}
